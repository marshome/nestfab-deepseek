<text x="60" y="1032" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#667085">注意：LaunchComputation ⇄ LaunchLocalComputation 互相调用 = 「云端不可用则本地算 / 强制云端」双向回退（已证实）。</text>
<text x="60" y="1058" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#667085">计算控制族（Wait*/Cancel*/Terminate*）都以 `cmp byte [rcx+0x48], 0` 起手，在日志里以 "Local"/"Cloud" 区分分支。</text>
