<text x="240" y="787.0" font-family="Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#33404d" text-anchor="middle">Compact 0x7D2610 · NoFitMap 0x7D29F0 · Warp 0x7D7940</text>
<text x="240" y="804.0" font-family="Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#33404d" text-anchor="middle">RCompact 0x7D2CB0 = xor eax,eax（旋转压缩阶段不可取消）</text>
<rect x="900" y="636" width="360" height="62" rx="31" fill="#eefaf3" stroke="#1f4d3a" stroke-width="1.3"/>
<text x="1080" y="672.0" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="600" fill="#10202f" text-anchor="middle">返回最优解</text>
<text x="60" y="846" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#667085">NestingNester 自带 std::mt19937（构造器 0x342E0：imul eax,eax,0x6C078965；[+0x9F8] = 0x270 = 624）</text>
<text x="60" y="872" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11.5" fill="#667085">⇒ 是「带随机扰动的确定性局部搜索」，不是遗传算法、也不是纯随机重启（已证实）。</text>
